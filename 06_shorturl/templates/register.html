<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - URL Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .hover-lift {
            transition: all 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="min-h-screen gradient-bg flex items-center justify-center px-6">
    <div class="max-w-md w-full">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">URL Shortener</h1>
            <p class="text-white text-opacity-90">Create your account</p>
        </div>

        <!-- Register Form -->
        <div class="glass-effect rounded-xl p-8 hover-lift">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Register</h2>
            
            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-4 p-4 rounded-lg {% if category == 'error' %}bg-red-100 text-red-700 border border-red-300{% else %}bg-green-100 text-green-700 border border-green-300{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="space-y-6">
                <div>
                    <label class="block mb-2">
                        <span class="text-gray-700 font-medium">Username</span>
                        <input
                            type="text"
                            name="username"
                            placeholder="Choose a username"
                            required
                            autofocus
                            minlength="3"
                            class="mt-2 block w-full border border-gray-300 rounded-lg p-4 text-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        >
                    </label>
                </div>
                
                <div>
                    <label class="block mb-2">
                        <span class="text-gray-700 font-medium">Password</span>
                        <input
                            type="password"
                            name="password"
                            placeholder="Choose a password"
                            required
                            minlength="6"
                            class="mt-2 block w-full border border-gray-300 rounded-lg p-4 text-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        >
                    </label>
                </div>

                <div>
                    <label class="block mb-2">
                        <span class="text-gray-700 font-medium">Confirm Password</span>
                        <input
                            type="password"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            required
                            minlength="6"
                            class="mt-2 block w-full border border-gray-300 rounded-lg p-4 text-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        >
                    </label>
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white px-6 py-3 rounded-lg font-semibold text-lg hover:from-blue-700 hover:to-purple-700 transition-all"
                >
                    Register
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-600">
                    Already have an account? 
                    <a href="/login" class="text-blue-600 hover:text-blue-800 font-semibold underline">Login here</a>
                </p>
            </div>

            <div class="mt-4 text-center">
                <a href="/" class="text-gray-600 hover:text-gray-800 text-sm">← Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
