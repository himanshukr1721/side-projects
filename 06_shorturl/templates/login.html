<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - URL Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            font-family: 'Courier New', monospace;
        }
        .brutal-border {
            border: 6px solid #000;
            box-shadow: 8px 8px 0px #000;
        }
        .brutal-border-thin {
            border: 4px solid #000;
        }
        .brutal-button {
            border: 4px solid #000;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s;
        }
        .brutal-button:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }
        .brutal-button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }
        .brutal-input {
            border: 4px solid #000;
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.1);
        }
        .brutal-input:focus {
            outline: none;
            border: 4px solid #000;
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.1), 0 0 0 4px #FFEB3B;
        }
    </style>
</head>
<body class="min-h-screen bg-yellow-300 flex items-center justify-center px-6">
    <div class="max-w-md w-full">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-5xl font-black text-black mb-2 uppercase">URL SHORTENER</h1>
            <p class="text-black font-bold text-lg">LOGIN TO MANAGE YOUR URLS</p>
        </div>

        <!-- Login Form -->
        <div class="bg-white brutal-border p-8">
            <h2 class="text-4xl font-black mb-6 text-black text-center uppercase">LOGIN</h2>
            
            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-6 p-4 {% if category == 'error' %}bg-red-500 text-white{% else %}bg-green-500 text-white{% endif %} brutal-border-thin font-black text-lg">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="space-y-6">
                <div>
                    <label class="block mb-3">
                        <span class="text-black font-black text-xl mb-2 block uppercase">Username</span>
                        <input
                            type="text"
                            name="username"
                            placeholder="ENTER YOUR USERNAME"
                            required
                            autofocus
                            class="brutal-input block w-full p-4 text-lg bg-white font-bold"
                        >
                    </label>
                </div>
                
                <div>
                    <label class="block mb-3">
                        <span class="text-black font-black text-xl mb-2 block uppercase">Password</span>
                        <input
                            type="password"
                            name="password"
                            placeholder="ENTER YOUR PASSWORD"
                            required
                            class="brutal-input block w-full p-4 text-lg bg-white font-bold"
                        >
                    </label>
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-black text-white px-6 py-4 brutal-button font-black text-xl uppercase"
                >
                    LOGIN
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-black font-bold text-lg">
                    DON'T HAVE AN ACCOUNT? 
                    <a href="/register" class="text-blue-600 font-black underline hover:text-blue-800">REGISTER HERE</a>
                </p>
            </div>

            <div class="mt-4 text-center">
                <a href="/" class="text-black font-bold hover:underline">← BACK TO HOME</a>
            </div>
        </div>
    </div>
</body>
</html>
